[project]
name = "legalmind"
version = "0.1.0"
description = "Domain-adapted legal LLM: QLoRA fine-tuning of Qwen3-8B with a deterministic UPL compliance layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Base deps: everything needed for data work and the eval harness.
# Training and serving pull in heavy/platform-specific wheels — see [project.optional-dependencies].
dependencies = [
    "anthropic==0.75.0",
    "datasets==3.6.0",
    "datasketch==1.6.5",
    "numpy==2.2.6",
    "python-dotenv==1.1.0",
    "pyyaml==6.0.2",
    # 1.16.1, not 1.15.3: the older wheel's _propack extension fails to dlopen
    # on current macOS ("__DATA/__thread_bss has a zero-fill section type"),
    # which breaks `from datasketch import MinHashLSH` — datasketch imports
    # scipy.integrate at module load, and that transitively reaches the broken
    # binary. Nothing here imports scipy directly; it is datasketch's dependency
    # and is pinned only so the version is a decision rather than a resolution.
    "scipy==1.16.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
# `uv sync --extra train` — works on macOS (MPS/CPU smoke test) and Linux GPU alike.
train = [
    "torch==2.7.0",
    "transformers==4.52.4",
    "peft==0.15.2",
    "trl==0.18.1",
    "accelerate==1.7.0",
    "wandb==0.19.11",
]
# `uv sync --extra train --extra gpu` — Linux + NVIDIA only. bitsandbytes has no
# working macOS wheel, so it is gated behind a platform marker rather than an
# extra alone (a bare `--extra gpu` on a Mac would otherwise fail to resolve).
gpu = [
    "bitsandbytes==0.46.0; sys_platform == 'linux'",
    "vllm==0.9.1; sys_platform == 'linux'",
]
serve = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "httpx==0.28.1",
    "prometheus-client==0.22.1",
    "pydantic==2.11.5",
    "sse-starlette==2.3.6",
]

[dependency-groups]
dev = [
    "mypy==1.16.0",
    "pytest==8.4.0",
    "pytest-asyncio==1.0.0",
    "ruff==0.11.13",
    "types-pyyaml==6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalmind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-length is enforced by the formatter, not the linter

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/legalmind", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
