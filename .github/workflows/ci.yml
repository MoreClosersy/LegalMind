name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep the model cache out of the default location so actions/cache can find it.
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  lint-and-test:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra train --extra serve

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Unit tests
        # Network-free by construction — no Hub access, no API key.
        run: uv run pytest -q

  smoke-train:
    name: CPU training smoke test
    runs-on: ubuntu-latest
    # A training script that cannot complete ten steps on CPU is broken. Finding
    # that out here costs four minutes; finding it out three hours into a Spot
    # instance costs the run.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra train

      - name: Cache Qwen3-0.6B
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-qwen3-0.6b-${{ hashFiles('configs/train_smoke_0.6b.yaml') }}

      - name: Train 10 steps on committed fixtures
        run: uv run python -m legalmind.train.sft --config configs/train_smoke_0.6b.yaml

      - name: Verify completion-only loss masking
        # The claim this project makes about not training on prompt tokens.
        # Masking failure is silent — the run still converges — so it is checked
        # explicitly rather than assumed.
        run: uv run python scripts/verify_masking.py --config configs/train_smoke_0.6b.yaml

  gateway-image:
    name: Gateway container
    runs-on: ubuntu-latest
    # The Dockerfile makes a claim — that the serving path needs six packages and
    # no GPU stack — and enforces it with an import check in the build. An
    # unbuilt Dockerfile is an untested one, so it is built here on every push
    # rather than the first time someone deploys.
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t legalmind-gateway:ci .

      - name: Boot it and check the compliance surface
        # Starting the container proves the entrypoint works; /healthz proves the
        # app is serving rather than merely listening, and reports the disclaimer
        # version an auditor would match a stored response against.
        run: |
          docker run -d --name gw -p 8080:8080 legalmind-gateway:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | tee /dev/stderr | grep -q disclaimer_version
          curl -fsS http://localhost:8080/metrics | grep -q legalmind_disclaimer_enforced_total
          docker rm -f gw

      - name: Report image size
        # The number this image exists to keep small. Printed so a regression is
        # visible in the log rather than discovered at deploy time.
        run: |
          docker image inspect legalmind-gateway:ci --format '{{.Size}}' \
            | awk '{printf "gateway image size: %.0f MB\n", $1/1048576}'
